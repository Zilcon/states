<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { font-family: Arial; margin: 20px; }
    .container { max-width: 400px; margin: auto; }
    input { width: 100%; margin: 5px 0; padding: 8px; }
    button { width: 100%; padding: 10px; margin-top: 10px; }
    .section { border: 1px solid #ccc; padding: 15px; margin-bottom: 20px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="section">
      <h2>ログイン</h2>
      <input id="loginUsername" placeholder="国名">
      <input id="loginPassword" type="password" placeholder="パスワード">
      <button onclick="login()">ログイン</button>
    </div>

    <div class="section">
      <h2>サインアップ</h2>
      <input id="signupUsername" placeholder="国名">
      <input id="signupPassword" type="password" placeholder="パスワード">
      <button onclick="signup()">登録</button>
    </div>
  </div>

  <script>
const WORKER_URL = "https://solitary-resonance-70a1.zilcon211006.workers.dev";

async function login() {
  const username = document.getElementById('loginUsername').value;
  const password = document.getElementById('loginPassword').value;

  const res = await fetch(WORKER_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      action: "login",
      username,
      password
    })
  });

  const data = await res.json();
  if (data.status === true) {
    alert('ログイン成功');
    window.location.href = `?page=hub&user=${encodeURIComponent(username)}`;
  } else {
    alert('ログイン失敗');
  }
}

async function signup() {
  const username = document.getElementById('signupUsername').value;
  const password = document.getElementById('signupPassword').value;

  const res = await fetch(WORKER_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      action: "signup",
      username,
      password
    })
  });

  const data = await res.json();
  alert(data.status);
}
  </script>
</body>
</html>
</html>
